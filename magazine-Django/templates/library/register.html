{% extends 'library/base.html' %}

{% block title %}Регистрация - Библиотека{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Регистрация</h1>
    </div>

    <div class="form-container" style="max-width: 500px; margin: 0 auto;">
        <form method="post" class="book-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Имя пользователя *</label>
                <input type="text" name="username" id="username" required class="form-control" autofocus>
                <small style="color: var(--text-secondary); font-size: 0.875rem;">Обязательное поле. До 150 символов.</small>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" name="email" id="email" required class="form-control">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">Имя</label>
                    <input type="text" name="first_name" id="first_name" class="form-control">
                </div>

                <div class="form-group">
                    <label for="last_name">Фамилия</label>
                    <input type="text" name="last_name" id="last_name" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label for="password1">Пароль *</label>
                <input type="password" name="password1" id="password1" required class="form-control">
                <small style="color: var(--text-secondary); font-size: 0.875rem;">Минимум 8 символов.</small>
            </div>

            <div class="form-group">
                <label for="password2">Подтверждение пароля *</label>
                <input type="password" name="password2" id="password2" required class="form-control">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success" style="width: 100%;">Зарегистрироваться</button>
            </div>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                Уже есть аккаунт? <a href="{% url 'login' %}" style="color: var(--primary-color); font-weight: 600;">Войдите</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
