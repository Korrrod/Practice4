{% extends 'library/base.html' %}

{% block title %}Вход - Библиотека{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Вход в систему</h1>
    </div>

    <div class="form-container" style="max-width: 400px; margin: 0 auto;">
        <form method="post" class="book-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" name="username" id="username" required class="form-control" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" name="password" id="password" required class="form-control">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
            </div>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                Нет аккаунта? <a href="{% url 'register' %}" style="color: var(--primary-color); font-weight: 600;">Зарегистрируйтесь</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
