{% extends 'travels/base.html' %}

{% block title %}Вход - Путешествия{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 420px;">
    <h1 style="margin-bottom: 24px; text-align: center;">Вход</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Имя пользователя</label>
            <input type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="form-group">
            <label for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        {% if form.errors %}
            <div class="message" style="margin-bottom: 16px;">Неверное имя пользователя или пароль.</div>
        {% endif %}
        <button type="submit" style="width: 100%;">Войти</button>
    </form>
    <p style="text-align: center; margin-top: 16px; color: var(--border);">
        Нет аккаунта? <a href="{% url 'register' %}" style="font-weight: 600; color: var(--text);">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
